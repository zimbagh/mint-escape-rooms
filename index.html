<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINT Escape Rooms</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #004080;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      flex: 1;
      height: 500px;
    }

    .room-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 250px;
      text-align: center;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .room-card:hover {
      transform: scale(1.05);
    }

    .room-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .room-card a {
      display: block;
      padding: 1rem;
      text-decoration: none;
      color: #004080;
      font-weight: bold;
      border-top: 1px solid #eee;
    }

    .room-card a:hover {
      background-color: #f0f0f0;
    }

    footer {
      background-color: #004080;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.9rem;
    }

    footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    footer a:hover {
      color: #cce6ff;
    }
    .room-card a {
  display: block;
  padding: 0.5rem; /* vorher 1rem, jetzt reduziert */
  text-decoration: none;
  color: #004080;
  font-weight: bold;
  font-size: 1.4rem; /* hinzugefügt: größere Schriftgröße */
  border-top: 1px solid #eee;
}
  </style>
</head>
<body>
  <header>
    <h1>MINT Escape Rooms</h1>
  </header>

  <div class="container">
    <div class="room-card">
      <img src="MINT/images/biologie.jpg" alt="MINT Raum" />
      <a href="./MINT">MINT</a>
    </div>
    <div class="room-card">
      <img src="Spaceship/assets/images/bg01.jpg" alt="Spaceship Raum" />
      <a href="./Spaceship">Spaceship</a>
    </div>
    <div class="room-card">
      <img src="KI/img/indexraum.jpg" alt="KI Raum" />
      <a href="./KI">KI</a>
    </div>
    <div class="room-card">
      <img src="Mondbasis/src/images/mondbasis.png" alt="Mondbasis Raum" />
      <a href="./Mondbasis">Mondbasis</a>
    </div>
    <div class="room-card">
      <img src="Zeitreise/images/krieg.jpg" alt="Zeitreise Raum" />
      <a href="./Zeitreise">Zeitreise</a>
    </div>
    
  </div>
  <div class="container"></div>
  <div class="container"></div>
  

  <footer>
    <p>
      Hochschule Heilbronn, Fakultät Technik
    </p>
    <p>
      <a href="https://www.hs-heilbronn.de/de/impressum" target="_blank">
        Impressum
      </a>
    </p>
    <p>
      <a href="Datenschutz.html" target="_blank">
        Datenschutz
      </a>
    </p>
  </footer>

  <script>
    // Alle Cookies löschen
    document.cookie.split(";").forEach(function(c) {
      document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
    });

    // localStorage löschen
    localStorage.clear();

    // sessionStorage löschen
    sessionStorage.clear();

    // IndexedDB löschen
    if (window.indexedDB) {
      indexedDB.databases().then((dbs) => {
        dbs.forEach((db) => {
          indexedDB.deleteDatabase(db.name);
        });
      });
    }
  </script>
</body>
</html>
